name: Analytics tests

on:
  push:
    paths:
      - 'analytics.js'
      - 'insights.js'
      - 'script.js'
      - 'dashboard.js'
      - 'index.html'
      - 'styles.css'
      - 'tests/**'
      - '.github/workflows/analytics-tests.yml'
  pull_request:
    paths:
      - 'analytics.js'
      - 'insights.js'
      - 'script.js'
      - 'dashboard.js'
      - 'index.html'
      - 'styles.css'
      - 'tests/**'
      - '.github/workflows/analytics-tests.yml'

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check analytics.js
      - run: node --check insights.js
      - run: node --check script.js
      - run: node --check dashboard.js
      - run: node --test tests/analytics.test.js
